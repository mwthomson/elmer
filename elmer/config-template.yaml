# Elmer Amateur Radio Assistant — Configuration
# Generated by /elmer-setup. Safe to edit by hand.

operator:
  callsign: ""           # Your callsign (e.g., W1AW)
  grid_square: ""        # Maidenhead grid locator (e.g., FN31pr)
  skill_level: ""        # beginner | intermediate | experienced

system:
  distro: ""             # e.g., ubuntu, debian, mx-linux, arch, fedora
  distro_version: ""     # e.g., 24.04, 12, 23.1
  distro_family: ""      # debian | redhat | arch
  package_manager: ""    # apt | dnf | pacman | zypper
  audio_stack: ""        # pulseaudio | pipewire | alsa

rigs:
  hf:
    enabled: false
    model: ""            # e.g., "Yaesu FT-710"
    manufacturer: ""     # yaesu | icom | kenwood | elecraft | other
    hamlib_id: null      # Hamlib rig model number (run: hamlib-riglist or rigctl -l)
    connection: usb      # usb | serial | network
    has_builtin_audio: false
    cat_port: ""         # e.g., /dev/hf-cat  (udev alias) or /dev/ttyUSB0
    audio_device: ""     # e.g., "FT-710" or "USB Audio CODEC"
    baud_rate: 38400
    data_bits: 8
    stop_bits: 2
    parity: none         # none | odd | even
    flow_control: none   # none | xon | rts

  vhf_uhf:
    enabled: false
    model: ""
    manufacturer: ""
    hamlib_id: null
    connection: usb
    interface: ""        # digirig | signalink | rigblaster | direct | other
    interface_model: ""  # e.g., "Digirig Lite"
    has_builtin_audio: false
    cat_port: ""         # e.g., /dev/vhf-cat or /dev/ttyUSB1
    audio_device: ""     # e.g., "Digirig Audio"
    ptt_method: ""       # rts | dtr | vox | cm108 | none
    ptt_port: ""         # serial port for PTT (often same as cat_port for Digirig)
    baud_rate: 9600

udev:
  configured: false
  rules_file: /etc/udev/rules.d/99-hamradio.rules

software:
  flrig:
    installed: false
    version: ""
  fldigi:
    installed: false
    version: ""
  hamlib:
    installed: false
    version: ""
  wsjt_x:
    installed: false
    version: ""
  js8call:
    installed: false
    version: ""
  js8_spotter:
    installed: false
    version: ""
  direwolf:
    installed: false
    version: ""
  pat:
    installed: false
    version: ""
  ardop:
    installed: false
    version: ""        # ardop2call | piardop2
  vara_hf:
    installed: false
    via_bottles: false
    bottles_bottle: "" # Name of the Bottles bottle containing VARA
  gqrx:
    installed: false
    version: ""
  sdrpp:
    installed: false
    version: ""
  xastir:
    installed: false
    version: ""
  aprx:
    installed: false
    version: ""
  cqrlog:
    installed: false
    version: ""
